<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="MoreRepitions" />
    <meta name="keywords" content="JavaScript, Python, C#, Solidity, Ruby" />
    <meta name="author" content="William Melton" />
    <title>Repeating Loops</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #1f2937, #0f172a 60%, #020817);
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }

      .scene {
        position: relative;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.08), 0 0 40px rgba(96, 165, 250, 0.12);
        border: 2px solid rgba(148, 163, 184, 0.35);
      }

      .orbit-ring {
        position: absolute;
        inset: 24px;
        border: 2px dashed rgba(255, 255, 255, 0.45);
        border-radius: 50%;
      }

      #loopBall {
        --pulse-scale: 1;
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(var(--pulse-scale));
        background: hsl(45, 100%, 60%);
        box-shadow: 0 0 20px rgba(255, 183, 3, 0.9), 0 0 35px rgba(255, 183, 3, 0.6);
        cursor: pointer;
        border: 2px solid rgba(255, 255, 255, 0.75);
        transition: background 0.18s ease, box-shadow 0.18s ease;
      }

      .caption {
        margin-top: 20px;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="scene" aria-label="Orbital loop demo">
        <div class="orbit-ring"></div>
        <div id="loopBall" tabindex="0" aria-label="Loop ball"></div>
      </div>
      <div class="caption">Click the loop</div>
    </div>

    <script src="MoreRepitions.js"></script>
  </body>
</html>
